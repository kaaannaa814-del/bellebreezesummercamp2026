<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BelleBreeze SummerCamp 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Playlist+Script&family=Montserrat:wght@800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
}

.cover{
  width:100vw;
  height:100vh;
  min-height:100svh;
  background:
    linear-gradient(rgba(0,0,0,0.12),rgba(0,0,0,0.12)),
    url("img/main.jpg") center center / cover no-repeat;
  position:relative;
}

.main-title{
  position:absolute;
  top:6%;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  text-align:center;
  color:#fff;
  text-shadow:2px 4px 10px rgba(0,0,0,0.22);
}

/* 上だけ手書き */
.small{
  display:block;
  font-family:'Playlist Script', cursive;
  font-size:clamp(2.5rem,8vw,5rem);
  margin-bottom:-15px;
  transform:rotate(-3deg);
}

/* Summer Camp は画像っぽく太字おしゃれ */
.big{
  display:block;
  font-family:'Montserrat', sans-serif;
  font-size:clamp(4.3rem,18vw,9rem);
  font-weight:800;
  letter-spacing:-4px;
  line-height:0.88;
  text-transform:uppercase;
}

.big.second{
  margin-top:-12px;
}

/* 下だけ手書き */
.year{
  display:block;
  font-family:'Playlist Script', cursive;
  font-size:clamp(2.4rem,8vw,4.8rem);
  margin-top:-10px;
  transform:rotate(2deg);
}
</style>
</head>

<body>

<div class="cover">
  <div class="main-title">
    <span class="small">Belle Breeze</span>
    <span class="big">Summer</span>
    <span class="big second">Camp</span>
    <span class="year">2026</span>
  </div>
</div>

</body>
</html>
