<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BelleBreeze SummerCamp 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'Noto Sans JP',sans-serif;
}

body{
  background:url('S__500170754.jpg') center/cover no-repeat;
  position:relative;
}

/* 背景を少し暗く */
body::before{
  content:'';
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.18);
  z-index:1;
}

/* 全体中央配置 */
.cover{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

/* タイトル全体 */
.main-title{
  line-height:0.95;
  animation:fadeUp 1.5s ease forwards;
  opacity:0;
}

/* Belle Breeze */
.main-title .small{
  display:block;
  font-size:34px;
  color:#ffffff;
  font-family:'Fredoka',sans-serif;
  margin-bottom:8px;
  transform:rotate(-2deg);
  text-shadow:0 4px 10px rgba(0,0,0,.35);
}

/* Summer Camp */
.main-title .big{
  display:block;
  font-size:96px;
  font-family:'Fredoka',sans-serif;
  color:#ffd400;
  -webkit-text-stroke:6px white;
  text-shadow:0 8px 20px rgba(0,0,0,.28);
  transform:rotate(-3deg);
}

/* 2026 */
.main-title .year{
  display:block;
  margin-top:-10px;
  font-size:58px;
  color:#ff8a00;
  font-family:'Fredoka',sans-serif;
  -webkit-text-stroke:4px white;
  transform:rotate(-5deg);
}

/* サブコピー */
.subcopy{
  margin-top:26px;
  background:white;
  color:#2f6ed8;
  padding:10px 20px;
  border-radius:30px;
  font-size:14px;
  font-weight:700;
  transform:rotate(-4deg);
  box-shadow:0 6px 14px rgba(0,0,0,.15);
}

/* TAP */
.tap{
  margin-top:34px;
  color:white;
  font-size:13px;
  letter-spacing:4px;
  animation:fade 2s infinite;
}

/* 線 */
.line{
  width:130px;
  height:2px;
  background:rgba(255,255,255,.8);
  margin-top:14px;
  border-radius:10px;
  animation:lineMove 1.5s ease;
}

/* アニメーション */
@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(30px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes fade{
  0%,100%{opacity:1;}
  50%{opacity:.35;}
}

@keyframes lineMove{
  from{
    width:0;
    opacity:0;
  }
  to{
    width:130px;
    opacity:1;
  }
}

/* スマホ */
@media screen and (max-width:768px){

.main-title .small{
  font-size:26px;
}

.main-title .big{
  font-size:70px;
  -webkit-text-stroke:4px white;
}

.main-title .year{
  font-size:42px;
}

.subcopy{
  font-size:12px;
  padding:8px 16px;
}

}
</style>
</head>

<body>

<div class="cover">

  <div class="main-title">
    <span class="small">Belle Breeze</span>
    <span class="big">Summer Camp</span>
    <span class="year">2026</span>
  </div>

  <div class="subcopy">Let's make the best memories!</div>

  <div class="tap">TAP TO START</div>

  <div class="line"></div>

</div>

</body>
</html>
