<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BelleBreeze SummerCamp 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'Noto Sans JP',sans-serif;
}

body{
  background:url('S__500170754.jpg') center/cover no-repeat;
  position:relative;
}

/* 少し暗く */
body::before{
  content:'';
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.28);
  z-index:1;
}

/* 全体 */
.cover{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}

/* タイトル */
.main-title{
  color:#f6d76b;
  font-family:'Playfair Display',serif;
  line-height:1.05;
  text-shadow:
    0 0 10px rgba(246,215,107,0.25),
    0 4px 18px rgba(0,0,0,0.35);

  animation:
    fadeUp 1.8s ease forwards,
    glow 4s ease-in-out infinite;

  opacity:0;
}

.main-title .small{
  display:block;
  font-size:28px;
  letter-spacing:5px;
  margin-bottom:8px;
  font-weight:500;
}

.main-title .big{
  display:block;
  font-size:76px;
  letter-spacing:1px;
}

.main-title .year{
  display:block;
  margin-top:12px;
  font-size:42px;
  letter-spacing:6px;
}

/* タップ文字 */
.tap{
  margin-top:40px;
  color:rgba(255,255,255,0.9);
  font-size:13px;
  letter-spacing:4px;
  animation:fade 2s infinite;
}

/* 下の線 */
.line{
  width:120px;
  height:1px;
  background:rgba(255,255,255,0.7);
  margin-top:18px;
  animation:lineMove 1.8s ease;
}

/* アニメーション */
@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(30px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes glow{
  0%,100%{
    text-shadow:
      0 0 8px rgba(246,215,107,0.2),
      0 4px 18px rgba(0,0,0,0.35);
  }

  50%{
    text-shadow:
      0 0 18px rgba(246,215,107,0.45),
      0 4px 24px rgba(0,0,0,0.45);
  }
}

@keyframes fade{
  0%,100%{
    opacity:1;
  }
  50%{
    opacity:0.35;
  }
}

@keyframes lineMove{
  from{
    width:0;
    opacity:0;
  }
  to{
    width:120px;
    opacity:1;
  }
}

/* スマホ */
@media screen and (max-width:768px){

  .main-title .small{
    font-size:20px;
  }

  .main-title .big{
    font-size:52px;
  }

  .main-title .year{
    font-size:30px;
  }

}
</style>
</head>

<body>

<div class="cover">

  <div class="main-title">
    <span class="small">BelleBreeze</span>
    <span class="big">SummerCamp</span>
    <span class="year">2026</span>
  </div>

  <div class="tap">TAP TO START</div>

  <div class="line"></div>

</div>

</body>
</html>
