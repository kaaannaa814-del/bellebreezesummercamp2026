<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Summer Camp 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'M PLUS Rounded 1c', sans-serif;
  background-image: url('summer.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  position: relative;
}

body::before {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.12);
}

/* 共通 */
.page {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 2;
  transition: opacity 0.8s ease;
}

.hidden {
  opacity: 0;
  pointer-events: none;
}

/* 表紙 */
.cover-page {
  cursor: pointer;
}

.cover-box {
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(12px);
  border-radius: 30px;
  padding: 40px 20px;
  width: 82%;
  max-width: 420px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,0.18);
}

.main-title {
  font-family: 'Playfair Display', serif;
  font-size: 68px;
  color: white;
  line-height: 1;
  margin-bottom: 10px;
  letter-spacing: 2px;
}

.sub-title {
  font-size: 16px;
  color: white;
  letter-spacing: 3px;
  margin-top: 10px;
}

.tap-text {
  margin-top: 40px;
  color: white;
  font-size: 14px;
  letter-spacing: 2px;
  animation: blink 1.5s infinite;
}

@keyframes blink {
  0%,100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* 太陽 */
.sun {
  position: absolute;
  top: -70px;
  right: -70px;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, #ffe066 0%, #ffb703 70%);
  z-index: 1;
  opacity: 0.9;
}

/* メニュー画面 */
.menu-page {
  justify-content: flex-start;
  padding-top: 70px;
}

.menu-title {
  font-family: 'Playfair Display', serif;
  font-size: 52px;
  color: white;
  margin-bottom: 45px;
  letter-spacing: 2px;
}

.link-group {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

.menu-link {
  width: 78%;
  max-width: 320px;
  text-decoration: none;
  text-align: center;
  padding: 16px 20px;
  border-radius: 20px;
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(8px);
  color: #ff7b00;
  font-family: 'Playfair Display', serif;
  font-size: 24px;
  font-weight: bold;
  border: 2px solid rgba(255,255,255,0.5);
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  transition: 0.3s;
}

.menu-link:active {
  transform: scale(0.96);
}

/* ポップアップ */
.popup-box {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 82%;
  max-width: 320px;
  background: rgba(255,255,255,0.97);
  border-radius: 20px;
  padding: 24px 20px 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  display: none;
  z-index: 100;
}

.popup-box.is-show {
  display: block;
}

.close-btn {
  position: absolute;
  top: 8px;
  right: 14px;
  font-size: 28px;
  color: #ff7b00;
  cursor: pointer;
}

.info-link {
  color: #ff7b00;
  font-weight: bold;
}

@media screen and (max-width: 768px) {
  .main-title {
    font-size: 54px;
  }

  .menu-title {
    font-size: 42px;
  }

  .menu-link {
    font-size: 22px;
  }
}
</style>
</head>
<body>

<div class="sun"></div>

<!-- 表紙 -->
<div class="page cover-page" id="cover" onclick="openMenu()">
  <div class="cover-box">
    <div class="main-title">Summer<br>Camp</div>
    <div class="sub-title">2026</div>
    <div class="tap-text">TAP TO START</div>
  </div>
</div>

<!-- メニュー -->
<div class="page menu-page hidden" id="menu">
  <div class="menu-title">Menu</div>

  <div class="link-group">
    <a href="#" class="menu-link" onclick="togglePopup(); return false;">POINT</a>

    <a href="items.html" class="menu-link">ITEMS</a>

    <a href="schedule.html" class="menu-link">SCHEDULE</a>
  </div>
</div>

<!-- ポップアップ -->
<div id="popup" class="popup-box">
  <span class="close-btn" onclick="togglePopup()">×</span>

  <h3 style="margin-top:0; color:#ff7b00; border-bottom:1px solid #ffd6a5; padding-bottom:5px;">
    Camp Info
  </h3>

  <div style="color:#555; font-size:14px; line-height:1.8;">
    <p><strong>日程：8/20(木)-8/21(金)</strong></p>

    <ul style="padding-left:1.2em;">
      <li>集合 8:00 新宿駅西口</li>
      <li>場所 湘南エリア</li>
      <li>合宿費 15,000円</li>
    </ul>

    <p style="font-size:12px; color:#d9534f;">
   
    </p>
  </div>
</div>

<script>
function openMenu() {
  document.getElementById('cover').classList.add('hidden');
  document.getElementById('menu').classList.remove('hidden');
}

function togglePopup() {
  document.getElementById('popup').classList.toggle('is-show');
}
</script>

</body>
</html>
